<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error del servidor — CRM System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center px-4">
    <div class="text-center max-w-md">
        <div class="w-20 h-20 mx-auto mb-6 rounded-full bg-red-50 flex items-center justify-center">
            <svg class="w-10 h-10 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
            </svg>
        </div>

        <h1 class="text-6xl font-bold text-[#1e3a5f] mb-2">500</h1>
        <h2 class="text-xl font-semibold text-gray-800 mb-3">Error interno del servidor</h2>
        <p class="text-gray-500 mb-8">
            Ocurrió un error inesperado. Nuestro equipo ha sido notificado. Por favor intente nuevamente en unos minutos.
        </p>

        <div class="flex flex-col sm:flex-row gap-3 justify-center">
            <a href="/dashboard/"
               class="inline-flex items-center justify-center px-5 py-2.5 bg-[#1e3a5f] text-white font-medium rounded-xl
                      hover:bg-[#152d4a] transition-all duration-200">
                Ir al Dashboard
            </a>
            <button onclick="location.reload()"
                    class="inline-flex items-center justify-center px-5 py-2.5 bg-gray-100 text-gray-700 font-medium rounded-xl
                           hover:bg-gray-200 transition-all duration-200">
                Reintentar
            </button>
        </div>
    </div>
</body>
</html>
