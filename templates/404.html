{% extends 'base.html' %}

{% block title %}Página no encontrada — CRM System{% endblock %}

{% block sidebar %}{% endblock %}

{% block content %}
<div class="flex items-center justify-center min-h-[60vh]">
    <div class="text-center max-w-md">
        <!-- Icon -->
        <div class="w-20 h-20 mx-auto mb-6 rounded-full bg-blue-50 flex items-center justify-center">
            <svg class="w-10 h-10 text-[#2c6e8a]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
        </div>

        <!-- Error code -->
        <h1 class="text-6xl font-bold text-[#1e3a5f] mb-2">404</h1>
        <h2 class="text-xl font-semibold text-gray-800 mb-3">Página no encontrada</h2>
        <p class="text-gray-500 mb-8">
            El recurso que busca no existe, fue eliminado o no tiene permisos para acceder a él.
        </p>

        <!-- Actions -->
        <div class="flex flex-col sm:flex-row gap-3 justify-center">
            <a href="/dashboard/"
               class="inline-flex items-center justify-center px-5 py-2.5 bg-[#1e3a5f] text-white font-medium rounded-xl
                      hover:bg-[#152d4a] transition-all duration-200 active:scale-[0.98]">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
                </svg>
                Ir al Dashboard
            </a>
            <button onclick="history.back()"
                    class="inline-flex items-center justify-center px-5 py-2.5 bg-gray-100 text-gray-700 font-medium rounded-xl
                           hover:bg-gray-200 transition-all duration-200">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
                </svg>
                Volver atrás
            </button>
        </div>
    </div>
</div>
{% endblock %}
