version: "3.9"

services:
  # ─────────────────────────────────────────────
  # Django + Gunicorn application
  # ─────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.prod
    environment:
      - DJANGO_SETTINGS_MODULE=crm.settings.production
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      - db
      - redis
    restart: always
    networks:
      - crm_prod_network

  # ─────────────────────────────────────────────
  # PostgreSQL database
  # ─────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    env_file:
      - .env.prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    networks:
      - crm_prod_network

  # ─────────────────────────────────────────────
  # Redis (cache / Celery broker)
  # ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: always
    networks:
      - crm_prod_network

  # ─────────────────────────────────────────────
  # Nginx reverse proxy
  # ─────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d/:/etc/nginx/conf.d/:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    depends_on:
      - web
    restart: always
    networks:
      - crm_prod_network

# ─────────────────────────────────────────────
# Named volumes
# ─────────────────────────────────────────────
volumes:
  postgres_data:
  static_volume:
  media_volume:

# ─────────────────────────────────────────────
# Networks
# ─────────────────────────────────────────────
networks:
  crm_prod_network:
    driver: bridge
